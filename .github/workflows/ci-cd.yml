name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  NODE_VERSION: "20"
  APP_DIR: apps/api

jobs:
  ci:
    name: CI — Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build project
        run: npm run build

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/api/package-lock.json') }}

      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APP_DIR }}/dist
          key: build-dist-${{ runner.os }}-${{ github.sha }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: ${{ env.APP_DIR }}/dist/

      - name: Upload Prisma schema
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema
          path: ${{ env.APP_DIR }}/prisma/

  deploy-staging:
    name: Deploy to Staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: ${{ env.APP_DIR }}/dist/

      - name: Download Prisma schema
        uses: actions/download-artifact@v4
        with:
          name: prisma-schema
          path: ${{ env.APP_DIR }}/prisma/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
            ghcr.io/${{ github.repository }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write staging .env file
        uses: appleboy/ssh-action@v1
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_REDIS_HOST: ${{ secrets.STAGING_REDIS_HOST }}
          STAGING_REDIS_PORT: ${{ secrets.STAGING_REDIS_PORT }}
          STAGING_REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
          STAGING_JWT_PRIVATE_KEY: ${{ secrets.STAGING_JWT_PRIVATE_KEY }}
          STAGING_JWT_PUBLIC_KEY: ${{ secrets.STAGING_JWT_PUBLIC_KEY }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: STAGING_DATABASE_URL,STAGING_REDIS_HOST,STAGING_REDIS_PORT,STAGING_REDIS_PASSWORD,STAGING_JWT_PRIVATE_KEY,STAGING_JWT_PUBLIC_KEY
          script: |
            mkdir -p /opt/ai-builder
            cat > /opt/ai-builder/.env << ENVEOF
            NODE_ENV=staging
            PORT=3001
            DATABASE_URL=$STAGING_DATABASE_URL
            REDIS_HOST=$STAGING_REDIS_HOST
            REDIS_PORT=$STAGING_REDIS_PORT
            REDIS_PASSWORD=$STAGING_REDIS_PASSWORD
            JWT_PRIVATE_KEY=$STAGING_JWT_PRIVATE_KEY
            JWT_PUBLIC_KEY=$STAGING_JWT_PUBLIC_KEY
            ENVEOF

      - name: SSH deploy — pull and restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
            docker stop ai-builder-staging 2>/dev/null || true
            docker rm ai-builder-staging 2>/dev/null || true
            docker run -d \
              --name ai-builder-staging \
              --restart unless-stopped \
              -p 3001:3001 \
              --env-file /opt/ai-builder/.env \
              ghcr.io/${{ github.repository }}:staging-${{ github.sha }}

      - name: Health check
        uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ secrets.STAGING_URL }}/api/health
          max-attempts: 6
          retry-delay: 10s
          retry-all: true

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: ${{ env.APP_DIR }}/dist/

      - name: Download Prisma schema
        uses: actions/download-artifact@v4
        with:
          name: prisma-schema
          path: ${{ env.APP_DIR }}/prisma/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:prod-${{ github.sha }}
            ghcr.io/${{ github.repository }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backup current container as prod-previous
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker tag ghcr.io/${{ github.repository }}:prod-latest \
              ghcr.io/${{ github.repository }}:prod-previous 2>/dev/null || true
            echo "Backed up prod-latest -> prod-previous"

      - name: Write production .env file
        uses: appleboy/ssh-action@v1
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_REDIS_HOST: ${{ secrets.PROD_REDIS_HOST }}
          PROD_REDIS_PORT: ${{ secrets.PROD_REDIS_PORT }}
          PROD_REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          PROD_JWT_PRIVATE_KEY: ${{ secrets.PROD_JWT_PRIVATE_KEY }}
          PROD_JWT_PUBLIC_KEY: ${{ secrets.PROD_JWT_PUBLIC_KEY }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_DATABASE_URL,PROD_REDIS_HOST,PROD_REDIS_PORT,PROD_REDIS_PASSWORD,PROD_JWT_PRIVATE_KEY,PROD_JWT_PUBLIC_KEY
          script: |
            mkdir -p /opt/ai-builder
            cat > /opt/ai-builder/.env << ENVEOF
            NODE_ENV=production
            PORT=3001
            DATABASE_URL=$PROD_DATABASE_URL
            REDIS_HOST=$PROD_REDIS_HOST
            REDIS_PORT=$PROD_REDIS_PORT
            REDIS_PASSWORD=$PROD_REDIS_PASSWORD
            JWT_PRIVATE_KEY=$PROD_JWT_PRIVATE_KEY
            JWT_PUBLIC_KEY=$PROD_JWT_PUBLIC_KEY
            ENVEOF

      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: PROD_DATABASE_URL
          script: |
            docker run --rm \
              -e DATABASE_URL="$PROD_DATABASE_URL" \
              ghcr.io/${{ github.repository }}:prod-${{ github.sha }} \
              npx prisma migrate deploy

      - name: Deploy new container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker stop ai-builder-production 2>/dev/null || true
            docker rm ai-builder-production 2>/dev/null || true
            docker run -d \
              --name ai-builder-production \
              --restart unless-stopped \
              -p 3001:3001 \
              --env-file /opt/ai-builder/.env \
              ghcr.io/${{ github.repository }}:prod-${{ github.sha }}

      - name: Health check (12 retries)
        id: health-check
        uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ secrets.PROD_URL }}/api/health
          max-attempts: 12
          retry-delay: 10s
          retry-all: true

      - name: Verify dependency connectivity
        run: |
          URL="${{ secrets.PROD_URL }}"
          echo "Checking $URL/api/health …"
          HEALTH=$(curl -sf "$URL/api/health")
          echo "$HEALTH" | jq -e '.dependencies.redis.ok == true' \
            || { echo "FAIL: Redis not reachable"; exit 1; }
          echo "$HEALTH" | jq -e '.dependencies.db.ok == true' \
            || { echo "FAIL: DB not reachable"; exit 1; }
          echo "All core dependencies are healthy"

      - name: Verify alerts endpoint
        run: |
          curl -sf "${{ secrets.PROD_URL }}/api/metrics/alerts" > /dev/null
          echo "Alerts endpoint reachable"

  rollback:
    name: Rollback Production
    needs: deploy-production
    if: always() && (needs.deploy-production.result == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: SSH rollback to prod-previous
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo ""
            echo "=========================================="
            echo "  ROLLBACK TRIGGERED"
            echo "=========================================="
            echo ""
            echo "Production deployment failed — restoring prod-previous"

            if docker image inspect ghcr.io/${{ github.repository }}:prod-previous >/dev/null 2>&1; then
              docker stop ai-builder-production 2>/dev/null || true
              docker rm ai-builder-production 2>/dev/null || true
              docker run -d \
                --name ai-builder-production \
                --restart unless-stopped \
                -p 3001:3001 \
                --env-file /opt/ai-builder/.env \
                ghcr.io/${{ github.repository }}:prod-previous
              echo "Rollback complete — prod-previous restored"
            else
              echo "WARNING: No prod-previous image found — service may be down"
              echo "Manual intervention required"
            fi

      - name: Notify rollback
        run: |
          echo "::error title=Production deploy FAILED — rollback executed::The production deployment failed. Automatic rollback to prod-previous has been completed. Check the Actions logs for details."
