name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  NODE_VERSION: "20"
  APP_DIR: apps/api
  IMAGE_REPO: ghcr.io/roma7899/ai-builder

jobs:
  ci:
    name: CI — Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build project
        run: npm run build

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/api/package-lock.json') }}

      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: ${{ env.APP_DIR }}/dist
          key: build-dist-${{ runner.os }}-${{ github.sha }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: ${{ env.APP_DIR }}/dist/

      - name: Upload Prisma schema
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema
          path: ${{ env.APP_DIR }}/prisma/

  deploy-staging:
    name: Deploy Staging
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: deploy-staging
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for deployment
        run: sleep 60

      - name: Health Check
        run: |
          for i in {1..6}; do
            STATUS=$(curl -s https://ai-builder-pasv.onrender.com/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed!"
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Placeholder
        run: echo "Production deploy not configured yet"

